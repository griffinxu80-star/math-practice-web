<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小学数学自测辅导 - 简化版</title>
<style>
:root { --primary: #2F5496; --bg: #F5F7FA; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: sans-serif; background: var(--bg); }
#app { padding: 20px; }
h1 { color: var(--primary); margin-bottom: 20px; }
.nav { background: white; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
.btn { display: inline-block; padding: 10px 20px; background: var(--primary); color: white; border-radius: 8px; text-decoration: none; margin: 5px; }
</style>
</head>
<body>
<div id="app">
<h1>小学数学自测辅导 - 简化版</h1>
<div class="nav">
<p>这是一个简化版本，不包含外部 JavaScript 依赖。</p>
<p>如果看到这个页面，说明 HTML 和 CSS 正常工作。</p>
<p>当前时间: <span id="time"></span></p>
</div>
<div>
<a class="btn" href="/">返回主页面</a>
<a class="btn" href="/debug2.html">查看调试信息</a>
</div>
</div>
<script>
document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');
</script>
</body>
</html>
